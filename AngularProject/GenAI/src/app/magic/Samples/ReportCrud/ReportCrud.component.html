<div novalidate [formGroup]="screenFormGroup">
    <div [magic]="mgc.ReportCrud">

        <div class="overlay-bar">
            <span>
                {{ mg.getCustomProperty(mgc.ReportCrud, 'WindowTitle') }}
            </span>
        </div>

        <div class="row pt-4 px-4">
            <div class="col-2">
                <mat-form-field [magic]="mgc.vDate" appearance="outline" class="w-100">
                    <mat-label>Report Date</mat-label>
                    <input matInput [matDatepicker]="vDate" [magic]="mgc.vDate" [formControlName]="mgc.vDate" mgFormat>
                    <mat-datepicker-toggle matSuffix [for]="vDate"></mat-datepicker-toggle>
                    <mat-datepicker #vDate></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Report Details</mat-label>
                    <textarea matInput type='text' [magic]="mgc.vDetails" [formControlName]="mgc.vDetails" mgFormat
                        rows="20"></textarea>
                </mat-form-field>
            </div>
        </div>
        <div class="buttons-container">
            <button class="action-button cancel-button" accesskey="c" [magic]="mgc.bCancel">
                Cancel
            </button>
            <button class="action-button" accesskey="s" [magic]="mgc.bSave">
                Save
            </button>
        </div>

    </div>
</div>
